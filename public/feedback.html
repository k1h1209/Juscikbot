<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VSM - 피드백</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f6f8;
            color: #17191c;
        }

        /* ========================================
           상단바
        ======================================== */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;
        }

        .brand {
            color: #111827;

            font-size: 20px;
            font-weight: 800;

            text-decoration: none;
        }

        .topbar-spacer {
            flex: 1;
        }

        .back-button {
            border: none;

            padding: 10px 16px;

            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        /* ========================================
           메인
        ======================================== */

        .container {
            width: min(
                100% - 32px,
                900px
            );

            margin:
                40px auto 80px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0 0 8px;

            font-size: 30px;
            font-weight: 800;
        }

        .page-header p {
            margin: 0;

            color: #6b7280;

            font-size: 14px;
        }

        /* ========================================
           작성 카드
        ======================================== */

        .feedback-form {
            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            padding: 22px;

            margin-bottom: 24px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.04);
        }

        .section-title {
            margin: 0 0 18px;

            font-size: 18px;
            font-weight: 800;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            padding: 12px;

            background: #ffffff;
            color: #111827;

            font-family: inherit;
            font-size: 14px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #111827;
        }

        textarea {
            min-height: 150px;

            resize: vertical;

            line-height: 1.6;
        }

        .submit-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 13px;

            background: #111827;
            color: #ffffff;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }

        .submit-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 12px;

            padding: 11px 13px;

            border-radius: 10px;

            font-size: 13px;
        }

        .message.success {
            display: block;

            background: #ecfdf5;
            color: #047857;
        }

        .message.error {
            display: block;

            background: #fef2f2;
            color: #b91c1c;
        }

        /* ========================================
           피드백 목록
        ======================================== */

        .feedback-list {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .feedback-card {
            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            padding: 20px;
        }

        .feedback-top {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .feedback-title {
            flex: 1;

            margin: 0;

            font-size: 17px;
            font-weight: 800;
        }

        .feedback-date {
            margin-top: 6px;

            color: #9ca3af;

            font-size: 12px;
        }

        .feedback-content {
            margin-top: 15px;

            color: #374151;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;
        }

        /* ========================================
           상태
        ======================================== */

        .status {
            flex-shrink: 0;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 800;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-review {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-accepted {
            background: #dcfce7;
            color: #15803d;
        }

        .status-rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .loading,
        .empty {
            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            padding: 35px 20px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }

        /* ========================================
           다크모드
        ======================================== */

        body.dark {
            background: #101214;
            color: #f1f3f5;
        }

        body.dark .topbar {
            background: #181b1f;
            border-color: #2d3238;
        }

        body.dark .brand {
            color: #f1f3f5;
        }

        body.dark .back-button,
        body.dark .submit-button {
            background: #292e34;
        }

        body.dark .page-header p {
            color: #9ca3af;
        }

        body.dark .feedback-form,
        body.dark .feedback-card,
        body.dark .loading,
        body.dark .empty {
            background: #181b1f;
            border-color: #2d3238;
        }

        body.dark input,
        body.dark textarea {
            background: #20242a;
            border-color: #3a4048;
            color: #f1f3f5;
        }

        body.dark input:focus,
        body.dark textarea:focus {
            border-color: #9ca3af;
        }

        body.dark .feedback-content {
            color: #d1d5db;
        }

        /* ========================================
           모바일
        ======================================== */

        @media (max-width: 600px) {

            .topbar {
                padding: 0 16px;
            }

            .container {
                width:
                    min(
                        100% - 20px,
                        900px
                    );

                margin-top: 28px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .feedback-form,
            .feedback-card {
                padding: 18px;
            }

            .feedback-top {
                align-items: flex-start;
            }

        }

    </style>
</head>

<body>

    <!-- ========================================
         상단바
    ======================================== -->

    <header class="topbar">

        <a
            href="/"
            class="brand"
        >
            VSM
        </a>

        <div class="topbar-spacer"></div>

        <button
            class="back-button"
            type="button"
            onclick="goBack()"
        >
            ← 돌아가기
        </button>

    </header>


    <!-- ========================================
         메인
    ======================================== -->

    <main class="container">

        <div class="page-header">

            <h1>
                📮 피드백
            </h1>

            <p>
                VSM에 대한 의견이나 개선사항을 보내주세요.
            </p>

        </div>


        <!-- ====================================
             피드백 작성
        ==================================== -->

        <section class="feedback-form">

            <h2 class="section-title">
                피드백 보내기
            </h2>

            <form id="feedbackForm">

                <div class="field">

                    <label for="title">
                        제목
                    </label>

                    <input
                        id="title"
                        type="text"
                        maxlength="100"
                        placeholder="피드백 제목을 입력하세요."
                        required
                    >

                </div>


                <div class="field">

                    <label for="content">
                        내용
                    </label>

                    <textarea
                        id="content"
                        maxlength="3000"
                        placeholder="VSM에 대한 의견을 자유롭게 작성해주세요."
                        required
                    ></textarea>

                </div>


                <button
                    class="submit-button"
                    id="submitButton"
                    type="submit"
                >
                    피드백 보내기
                </button>

            </form>


            <div
                class="message"
                id="message"
            ></div>

        </section>


        <!-- ====================================
             내 피드백
        ==================================== -->

        <section>

            <h2 class="section-title">
                내 피드백
            </h2>

            <div
                class="feedback-list"
                id="feedbackList"
            >

                <div class="loading">
                    피드백을 불러오는 중...
                </div>

            </div>

        </section>

    </main>


    <script>

        /* ========================================
           테마
        ======================================== */

        function applyTheme() {

            const theme =
                localStorage.getItem(
                    "vsm-theme"
                );

            document.body.classList.toggle(
                "dark",
                theme === "dark"
            );

        }

        applyTheme();


        /* ========================================
           뒤로가기
        ======================================== */

        function goBack() {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href = "/";

            }

        }


        /* ========================================
           인증 토큰
        ======================================== */

        function getToken() {

            return (
                localStorage.getItem(
                    "vsm-token"
                ) ||
                localStorage.getItem(
                    "token"
                ) ||
                ""
            );

        }


        /* ========================================
           HTML 이스케이프
        ======================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ========================================
           날짜
        ======================================== */

        function formatDate(timestamp) {

            if (!timestamp) {
                return "";
            }

            const date =
                new Date(
                    Number(timestamp)
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }

            return date.toLocaleString(
                "ko-KR",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric",

                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        /* ========================================
           상태 표시
        ======================================== */

        function getStatus(status) {

            const map = {

                pending: {
                    text: "보류중",
                    className:
                        "status-pending"
                },

                review: {
                    text: "검토중",
                    className:
                        "status-review"
                },

                accepted: {
                    text: "수락",
                    className:
                        "status-accepted"
                },

                rejected: {
                    text: "거절",
                    className:
                        "status-rejected"
                }

            };

            return (
                map[status] ||
                {
                    text: status || "알 수 없음",
                    className:
                        "status-pending"
                }
            );

        }


        /* ========================================
           내 피드백 불러오기
        ======================================== */

        async function loadFeedback() {

            const list =
                document.getElementById(
                    "feedbackList"
                );

            const token =
                getToken();

            if (!token) {

                list.innerHTML = `
                    <div class="empty">
                        피드백을 확인하려면 로그인이 필요합니다.
                    </div>
                `;

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/feedback",
                        {
                            headers: {
                                "Authorization":
                                    "Bearer " +
                                    token
                            }
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    data.ok === false
                ) {

                    throw new Error(
                        data.error ||
                        "피드백을 불러오지 못했습니다."
                    );

                }

                const feedback =
                    Array.isArray(
                        data.feedback
                    )
                        ? data.feedback
                        : [];


                if (
                    feedback.length === 0
                ) {

                    list.innerHTML = `
                        <div class="empty">
                            아직 보낸 피드백이 없습니다.
                        </div>
                    `;

                    return;

                }


                feedback.sort(
                    (
                        a,
                        b
                    ) =>
                        Number(
                            b.created_at || 0
                        ) -
                        Number(
                            a.created_at || 0
                        )
                );


                list.innerHTML =
                    feedback
                        .map(
                            item => {

                                const status =
                                    getStatus(
                                        item.status
                                    );

                                return `
                                    <article
                                        class="feedback-card"
                                    >

                                        <div
                                            class="feedback-top"
                                        >

                                            <h3
                                                class="feedback-title"
                                            >
                                                ${escapeHtml(
                                                    item.title
                                                )}
                                            </h3>

                                            <span
                                                class="status ${status.className}"
                                            >
                                                ${status.text}
                                            </span>

                                        </div>

                                        <div
                                            class="feedback-date"
                                        >
                                            ${escapeHtml(
                                                formatDate(
                                                    item.created_at
                                                )
                                            )}
                                        </div>

                                        <div
                                            class="feedback-content"
                                        >
                                            ${escapeHtml(
                                                item.content
                                            )}
                                        </div>

                                    </article>
                                `;

                            }
                        )
                        .join("");

            } catch (error) {

                console.error(
                    "FEEDBACK LOAD ERROR:",
                    error
                );

                list.innerHTML = `
                    <div class="empty">
                        ${escapeHtml(
                            error.message ||
                            "피드백을 불러오지 못했습니다."
                        )}
                    </div>
                `;

            }

        }


        /* ========================================
           피드백 제출
        ======================================== */

        const feedbackForm =
            document.getElementById(
                "feedbackForm"
            );

        const submitButton =
            document.getElementById(
                "submitButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        feedbackForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const token =
                    getToken();


                if (!token) {

                    message.className =
                        "message error";

                    message.textContent =
                        "피드백을 보내려면 로그인이 필요합니다.";

                    return;

                }


                const title =
                    document
                        .getElementById(
                            "title"
                        )
                        .value
                        .trim();


                const content =
                    document
                        .getElementById(
                            "content"
                        )
                        .value
                        .trim();


                if (
                    !title ||
                    !content
                ) {

                    message.className =
                        "message error";

                    message.textContent =
                        "제목과 내용을 모두 입력하세요.";

                    return;

                }


                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "보내는 중...";


                try {

                    const response =
                        await fetch(
                            "/api/feedback",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " +
                                        token
                                },

                                body:
                                    JSON.stringify({
                                        title,
                                        content
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        data.ok === false
                    ) {

                        throw new Error(
                            data.error ||
                            "피드백 전송에 실패했습니다."
                        );

                    }


                    message.className =
                        "message success";

                    message.textContent =
                        "피드백이 정상적으로 전송되었습니다.";


                    feedbackForm.reset();


                    await loadFeedback();

                } catch (error) {

                    console.error(
                        "FEEDBACK SEND ERROR:",
                        error
                    );

                    message.className =
                        "message error";

                    message.textContent =
                        error.message ||
                        "피드백 전송에 실패했습니다.";

                } finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "피드백 보내기";

                }

            }
        );


        /* ========================================
           시작
        ======================================== */

        loadFeedback();

    </script>

</body>
</html>
