
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VSM - 변경사항</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f6f8;
            color: #17191c;

            transition:
                background-color .2s ease,
                color .2s ease;
        }


        /* ========================================
           상단바
        ======================================== */

        .topbar {

            position: sticky;
            top: 0;
            z-index: 100;

            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            transition:
                background-color .2s ease,
                border-color .2s ease;
        }

        .brand {

            color: #111827;

            font-size: 20px;
            font-weight: 800;

            text-decoration: none;
        }

        .topbar-spacer {
            flex: 1;
        }

        .back-button {

            border: none;

            padding: 10px 16px;

            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }


        /* ========================================
           메인
        ======================================== */

        .container {

            width:
                min(
                    calc(100% - 32px),
                    900px
                );

            margin:
                40px auto 80px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {

            margin:
                0 0 8px;

            font-size: 30px;
            font-weight: 800;
        }

        .page-header p {

            margin: 0;

            color: #6b7280;

            font-size: 14px;
        }


        /* ========================================
           변경사항 목록
        ======================================== */

        .changes-list {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .change-card {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            padding: 22px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, .04);

            transition:
                background-color .2s ease,
                border-color .2s ease;
        }

        .change-title {

            margin: 0;

            font-size: 18px;
            font-weight: 800;

            color: #111827;
        }

        .change-date {

            margin-top: 7px;

            color: #9ca3af;

            font-size: 12px;
        }

        .change-content {

            margin-top: 16px;

            color: #374151;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* ========================================
           상태
        ======================================== */

        .loading,
        .empty {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            padding: 40px 20px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }


        /* ========================================
           다크모드
        ======================================== */

        body.dark {

            background: #101214;
            color: #f1f3f5;
        }

        body.dark .topbar {

            background: #181b1f;

            border-color:
                #2d3238;
        }

        body.dark .brand {

            color: #f1f3f5;
        }

        body.dark .back-button {

            background: #292e34;

            color: #ffffff;
        }

        body.dark .page-header p {

            color: #9ca3af;
        }

        body.dark .change-card {

            background: #181b1f;

            border-color:
                #2d3238;
        }

        body.dark .change-title {

            color: #f1f3f5;
        }

        body.dark .change-content {

            color: #d1d5db;
        }

        body.dark .loading,
        body.dark .empty {

            background: #181b1f;

            border-color:
                #2d3238;

            color: #9ca3af;
        }


        /* ========================================
           모바일
        ======================================== */

        @media (max-width: 600px) {

            .topbar {
                padding: 0 16px;
            }

            .container {

                width:
                    min(
                        calc(100% - 20px),
                        900px
                    );

                margin-top: 28px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .change-card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <a
        href="/"
        class="brand"
    >
        VSM
    </a>

    <div class="topbar-spacer"></div>

    <button
        type="button"
        class="back-button"
        onclick="goBack()"
    >
        ← 돌아가기
    </button>

</header>


<main class="container">

    <div class="page-header">

        <h1>
            📝 변경사항
        </h1>

        <p>
            VSM의 새로운 업데이트와 변경사항을 확인하세요.
        </p>

    </div>


    <section
        class="changes-list"
        id="changesList"
    >

        <div class="loading">
            변경사항을 불러오는 중...
        </div>

    </section>

</main>


<script>

    /* ========================================
       테마
    ======================================== */

    function applyTheme() {

        const theme =
            localStorage.getItem(
                "vsm-theme"
            );

        document.body.classList.toggle(
            "dark",
            theme === "dark"
        );

    }

    applyTheme();


    /* ========================================
       뒤로가기
    ======================================== */

    function goBack() {

        if (
            window.history.length > 1
        ) {

            window.history.back();

        } else {

            window.location.href = "/";

        }

    }


    /* ========================================
       HTML 이스케이프
    ======================================== */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ========================================
       날짜
    ======================================== */

    function formatDate(timestamp) {

        if (!timestamp) {
            return "";
        }

        const date =
            new Date(
                Number(timestamp)
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }

        return date.toLocaleString(
            "ko-KR",
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* ========================================
       변경사항 불러오기
    ======================================== */

    async function loadChanges() {

        const list =
            document.getElementById(
                "changesList"
            );

        try {

            const response =
                await fetch(
                    "/api/changes"
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                data.ok === false
            ) {

                throw new Error(
                    data.error ||
                    "변경사항을 불러오지 못했습니다."
                );

            }

            const changes =
                Array.isArray(
                    data.changes
                )
                    ? data.changes
                    : [];


            if (
                changes.length === 0
            ) {

                list.innerHTML = `
                    <div class="empty">
                        아직 등록된 변경사항이 없습니다.
                    </div>
                `;

                return;

            }


            list.innerHTML =
                changes
                    .map(
                        item => {

                            return `
                                <article
                                    class="change-card"
                                >

                                    <h2
                                        class="change-title"
                                    >
                                        ${escapeHtml(
                                            item.title
                                        )}
                                    </h2>

                                    <div
                                        class="change-date"
                                    >
                                        ${escapeHtml(
                                            formatDate(
                                                item.created_at
                                            )
                                        )}
                                    </div>

                                    <div
                                        class="change-content"
                                    >
                                        ${escapeHtml(
                                            item.content
                                        )}
                                    </div>

                                </article>
                            `;

                        }
                    )
                    .join("");

        } catch (error) {

            console.error(
                "CHANGES LOAD ERROR:",
                error
            );

            list.innerHTML = `
                <div class="empty">
                    ${escapeHtml(
                        error.message ||
                        "변경사항을 불러오지 못했습니다."
                    )}
                </div>
            `;

        }

    }


    /* ========================================
       시작
    ======================================== */

    loadChanges();

</script>


</body>

</html>
