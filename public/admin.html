<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSM 관리자 센터</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b14}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="adminFrame" src="/admin-v2.html" title="VSM 관리자 패널"></iframe>
<script>
(function(){
    const frame = document.getElementById("adminFrame");
    let timer = null;
    let busy = false;

    function startAutoRefresh(){
        if(timer) return;

        timer = setInterval(async () => {
            if(busy) return;

            try{
                const doc = frame.contentDocument;
                const win = frame.contentWindow;

                if(!doc || !win) return;

                const app = doc.getElementById("app");
                const login = doc.getElementById("login");

                // 로그인 전에는 아무 요청도 보내지 않습니다.
                if(!app || app.classList.contains("hidden")) return;
                if(login && !login.classList.contains("hidden")) return;

                // 기존 관리자 패널의 새로고침 버튼이 실행하는 것과
                // 동일한 refreshAll()을 2초마다 호출합니다.
                if(typeof win.refreshAll !== "function") return;

                busy = true;
                await win.refreshAll();
            }catch(error){
                // 자동 새로고침 오류가 관리자 화면 전체를 멈추지 않게 합니다.
                console.warn("VSM Admin auto refresh:", error);
            }finally{
                busy = false;
            }
        }, 2000);
    }

    frame.addEventListener("load", startAutoRefresh);
    startAutoRefresh();
})();
</script>
</body>
</html>
