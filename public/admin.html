<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSM 관리자</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#222}button,input,textarea{padding:9px;border-radius:8px;border:1px solid #ddd}button{cursor:pointer;font-weight:bold}.top{padding:15px;background:#222;color:#fff;display:flex;gap:8px}.top span{flex:1}.wrap{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 58px)}aside{background:#fff;padding:12px}aside button{display:block;width:100%;margin:4px 0;text-align:left}.active{background:#222;color:#fff}.main{padding:20px}.tab{display:none}.tab.on{display:block}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.scroll{overflow:auto}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.row input{width:100%;box-sizing:border-box}@media(max-width:750px){.wrap{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="card" style="max-width:400px;margin:15vh auto"><h2>VSM 관리자</h2><input id="pw" type="password" placeholder="관리자 비밀번호" style="width:100%;box-sizing:border-box"><button onclick="login()" style="margin-top:8px;width:100%">로그인</button><p id="err"></p></div><div id="app" style="display:none"><div class="top"><b>VSM 관리자</b><span></span><button onclick="openVsm()">VSM 열기</button><button onclick="location.reload()">로그아웃</button></div><div class="wrap"><aside><button class="active" onclick="tab('home',this)">📊 대시보드</button><button onclick="tab('stocks',this)">📈 주식</button><button onclick="tab('users',this)">👥 플레이어</button><button onclick="tab('feedback',this)">💬 피드백</button><button onclick="tab('notices',this)">📢 공지</button><button onclick="tab('maintenance',this)">🛠 점검</button></aside><main class="main"><section id="home" class="tab on"><h2>대시보드</h2><div id="dash" class="grid"></div><div class="card"><h3>주식</h3><div id="dashStocks"></div></div></section><section id="stocks" class="tab"><h2>주식 관리</h2><div class="card"><h3>주식 추가</h3><div class="row"><input id="nid" placeholder="코드"><input id="nname" placeholder="회사명"><input id="nprice" type="number" placeholder="시작 주가"><input id="nmin" type="number" placeholder="최소 변동금액"><input id="nmax" type="number" placeholder="최대 변동금액"></div><button onclick="addStock()" style="margin-top:8px">추가</button></div><div class="scroll"><table class="table"><thead><tr><th>코드</th><th>회사</th><th>주가</th><th>최소</th><th>최대</th><th>관리</th></tr></thead><tbody id="stocks"></tbody></table></div></section><section id="users" class="tab"><h2>플레이어</h2><div class="scroll"><table class="table"><thead><tr><th>번호</th><th>아이디</th><th>닉네임</th><th>잔액</th><th>상태</th><th>관리</th></tr></thead><tbody id="users"></tbody></table></div></section><section id="feedback" class="tab"><h2>피드백</h2><div class="scroll"><table class="table"><thead><tr><th>제목</th><th>작성자</th><th>내용</th><th>상태</th></tr></thead><tbody id="feedback"></tbody></table></div></section><section id="notices" class="tab"><h2>공지</h2><div class="card"><input id="nt" placeholder="제목" style="width:100%;box-sizing:border-box"><textarea id="nc" placeholder="내용" style="width:100%;box-sizing:border-box;margin-top:7px"></textarea><button onclick="addNotice()">등록</button></div><div id="notices"></div></section><section id="maintenance" class="tab"><h2>점검</h2><div class="card"><p id="ms">불러오는 중</p><button onclick="maintenance(true)">점검 시작</button><button onclick="maintenance(false)">점검 종료</button></div></section></main></div></div><script>let P="",S=[],U=[];const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>Number(x||0).toLocaleString()+"원";async function api(p,o={}){let r=await fetch('/api/admin'+p,{...o,headers:{'Content-Type':'application/json','x-admin-password':P,...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패');return d}async function login(){P=$('pw').value;try{await api('/check');$('login').style.display='none';$('app').style.display='block';load();}catch(e){$('err').textContent=e.message}}function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));$(id).classList.add('on');b.classList.add('active');loadTab(id)}async function load(){await Promise.all([loadStocks(),loadUsers(),loadFeedback(),loadNotices(),loadMaintenance()]);dash()}async function loadTab(id){if(id==='stocks')await loadStocks();if(id==='users')await loadUsers();if(id==='feedback')await loadFeedback();if(id==='notices')await loadNotices();if(id==='maintenance')await loadMaintenance();if(id==='home'){await loadStocks();await loadUsers();dash()}}async function loadStocks(){let d=await api('/stocks');S=d.stocks;$('stocks').innerHTML=S.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${money(s.price)}</td><td>${money(s.minChange)}</td><td>${money(s.maxChange)}</td><td><button onclick="editStock('${s.id}')">수정</button> <button onclick="ctrl('${s.id}','up')">상승</button> <button onclick="ctrl('${s.id}','down')">하락</button> <button onclick="delStock('${s.id}')">삭제</button></td></tr>`).join('');dash()}async function addStock(){try{await api('/stocks',{method:'POST',body:JSON.stringify({id:$('nid').value,name:$('nname').value,price:$('nprice').value,minChange:$('nmin').value,maxChange:$('nmax').value})});await loadStocks()}catch(e){alert(e.message)}}async function editStock(id){let s=S.find(x=>x.id===id),name=prompt('회사명',s.name);if(name===null)return;let min=prompt('최소 변동금액',s.minChange);if(min===null)return;let max=prompt('최대 변동금액',s.maxChange);if(max===null)return;let price=prompt('현재 주가(비워두면 유지)','');try{await api('/stocks/'+id,{method:'PATCH',body:JSON.stringify({name,minChange:min,maxChange:max,price:price||undefined})});await loadStocks()}catch(e){alert(e.message)}}async function ctrl(id,d){let sec=prompt('몇 초 동안 적용?',30);if(sec===null)return;try{await api('/stocks/'+id+'/control',{method:'POST',body:JSON.stringify({direction:d,seconds:sec})});alert('적용 완료')}catch(e){alert(e.message)}}async function delStock(id){if(!confirm(id+' 삭제?'))return;try{await api('/stocks/'+id,{method:'DELETE'});await loadStocks()}catch(e){alert(e.message)}}async function loadUsers(){let d=await api('/users');U=d.users;$('users').innerHTML=U.map(u=>`<tr><td>${u.player_number??'-'}</td><td>${esc(u.username)}</td><td>${esc(u.nickname)}</td><td>${money(u.cash)}</td><td>${u.banned_until&&Number(u.banned_until)>Date.now()?'🚫 밴':'정상'}</td><td><button onclick="userEdit('${u.id}')">수정</button> <button onclick="ban('${u.id}')">밴</button> <button onclick="unban('${u.id}')">해제</button></td></tr>`).join('');dash()}async function userEdit(id){let u=U.find(x=>x.id===id),n=prompt('닉네임',u.nickname);if(n===null)return;let c=prompt('잔액',u.cash);if(c===null)return;try{await api('/users/'+id,{method:'PATCH',body:JSON.stringify({nickname:n,cash:c})});await loadUsers()}catch(e){alert(e.message)}}async function ban(id){let d=prompt('분 또는 permanent','60');if(d===null)return;try{await api('/users/'+id+'/ban',{method:'POST',body:JSON.stringify({duration:d,reason:prompt('사유','')||''})});await loadUsers()}catch(e){alert(e.message)}}async function unban(id){try{await api('/users/'+id+'/unban',{method:'POST'});await loadUsers()}catch(e){alert(e.message)}}async function loadFeedback(){let d=await api('/feedback');$('feedback').innerHTML=d.feedback.map(f=>`<tr><td>${esc(f.title)}</td><td>${esc(f.nickname||f.username||'탈퇴')}</td><td>${esc(f.content)}</td><td><select onchange="fstatus(${f.id},this.value)"><option>pending</option><option>reviewing</option><option>resolved</option><option>rejected</option></select></td></tr>`).join('')}async function fstatus(id,s){try{await api('/feedback/'+id,{method:'PATCH',body:JSON.stringify({status:s})})}catch(e){alert(e.message)}}async function loadNotices(){let d=await api('/notices');$('notices').innerHTML=d.notices.map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.content)}</p><button onclick="delNotice(${n.id})">삭제</button></div>`).join('')}async function addNotice(){try{await api('/notices',{method:'POST',body:JSON.stringify({title:$('nt').value,content:$('nc').value})});$('nt').value='';$('nc').value='';await loadNotices()}catch(e){alert(e.message)}}async function delNotice(id){try{await api('/notices/'+id,{method:'DELETE'});await loadNotices()}catch(e){alert(e.message)}}async function loadMaintenance(){let d=await api('/maintenance'),m=d.maintenance;$('ms').textContent=m.enabled?'🛠 점검 중':'✅ 점검 없음'}async function maintenance(on){try{await api('/maintenance',{method:'POST',body:JSON.stringify({enabled:on})});await loadMaintenance()}catch(e){alert(e.message)}}function dash(){$('dash').innerHTML=`<div class="card"><b>주식</b><h2>${S.length}</h2></div><div class="card"><b>플레이어</b><h2>${U.length}</h2></div>`;$('dashStocks').innerHTML=S.map(s=>`<p><b>${esc(s.id)}</b> ${esc(s.name)} · ${money(s.price)} · 변동 ${money(s.minChange)}~${money(s.maxChange)}</p>`).join('')}async function openVsm(){try{let d=await api('/site-token',{method:'POST'});location.href='/admin/vsm?token='+encodeURIComponent(d.token)}catch(e){alert(e.message)}}</script></body></html>
