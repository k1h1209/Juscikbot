### 2. `admin.html`의 `<script>` 안

기존 `openUserDetail()`과 `saveUserDetail()`을 아래 코드로 교체하고, 바로 그 아래에 주식/거래 UI 함수들을 추가하면 돼.

```javascript
/* ========================================
   플레이어 상세정보
======================================== */

async function openUserDetail(id) {

    try {

        const data =
            await api(
                `/api/admin/users/${encodeURIComponent(id)}`
            );

        const user =
            data.user;


        document
            .getElementById(
                "detailUserId"
            )
            .value =
            user.id;


        document
            .getElementById(
                "detailId"
            )
            .textContent =
            user.id;


        document
            .getElementById(
                "detailCreated"
            )
            .textContent =
            formatDate(
                user.createdAt ??
                user.created_at
            );


        document
            .getElementById(
                "detailNickname"
            )
            .value =
            user.nickname || "";


        document
            .getElementById(
                "detailPlayerNumber"
            )
            .value =
            user.playerNumber ??
            user.player_number ??
            "";


        document
            .getElementById(
                "detailCash"
            )
            .value =
            Number(
                user.cash || 0
            );


        renderHoldings(
            user.holdings || {}
        );


        renderTransactions(
            user.transactions || []
        );


        const banned =
            user.bannedUntil
                ? Number(user.bannedUntil) > Date.now()
                : user.banned_until
                    ? Number(user.banned_until) > Date.now()
                    : false;

        const bannedUntil =
            user.bannedUntil ??
            user.banned_until;

        const banReason =
            user.banReason ??
            user.ban_reason;


        document
            .getElementById(
                "detailBan"
            )
            .innerHTML =

            banned

            ? `
                <span class="status status-banned">
                    밴 상태
                </span>

                <br><br>

                종료:
                ${formatDate(bannedUntil)}

                <br>

                사유:
                ${escapeHtml(
                    banReason || "-"
                )}
              `

            : `
                <span class="status status-normal">
                    정상
                </span>
              `;


        openModal(
            "userModal"
        );

    } catch (error) {

        alert(
            error.message
        );

    }

}

function renderHoldings(holdings) {

    const tbody =
        document.getElementById(
            "holdingsTable"
        );

    tbody.innerHTML = "";


    let entries = [];


    /*
     * 기존 holdings 구조:
     *
     * {
     *     "SKNX": 10,
     *     "SAMS": 5
     * }
     */

    if (
        holdings &&
        typeof holdings === "object" &&
        !Array.isArray(holdings)
    ) {

        entries =
            Object.entries(
                holdings
            ).map(
                ([stockId, quantity]) => ({
                    stockId,
                    quantity:
                        Number(quantity) || 0
                })
            );

    }


    document
        .getElementById(
            "holdingsCount"
        )
        .textContent =
        entries.length;


    if (!entries.length) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="3"
                    class="empty-detail"
                >
                    보유 주식이 없습니다.
                </td>
            </tr>
        `;

        return;
    }


    entries.forEach(
        holding => {

            addHoldingRow(
                holding.stockId,
                holding.quantity
            );

        }
    );

}

    const count =
        Array.from(rows)
            .filter(
                row =>

    document

        )
        .textContent =
        count;

/* ========================================
   보유 주식 데이터 생성
======================================== */

function collectHoldings() {

    const holdings = {};


    document
        .querySelectorAll(
            "#holdingsTable tr"
        )
        .forEach(
            row => {

                const stockInput =
                    row.querySelector(
                        ".holding-stock"
                    );

                const quantityInput =
                    row.querySelector(
                        ".holding-quantity"
                    );


                if (
                    !stockInput ||
                    !quantityInput
                ) {
                    return;
                }


                const stockId =
                    stockInput
                        .value
                        .trim()
                        .toUpperCase();


                const quantity =
                    Number(
                        quantityInput.value
                    );


                if (!stockId) {
                    return;
                }


                if (
                    !Number.isFinite(
                        quantity
                    ) ||
                    quantity < 0
                ) {
                    return;
                }


                holdings[stockId] =
                    quantity;

            }
        );


    return holdings;

}

/* ========================================
   거래 데이터 생성
======================================== */

function collectTransactions() {

    const transactions = [];


    document
        .querySelectorAll(
            "#transactionsTable tr"
        )
        .forEach(
            row => {

                const timeInput =
                    row.querySelector(
                        ".transaction-time"
                    );

                const typeInput =
                    row.querySelector(
                        ".transaction-type"
                    );

                const stockInput =
                    row.querySelector(
                        ".transaction-stock"
                    );

                const quantityInput =
                    row.querySelector(
                        ".transaction-quantity"
                    );

                const priceInput =
                    row.querySelector(
                        ".transaction-price"
                    );

                const totalInput =
                    row.querySelector(
                        ".transaction-total"
                    );


                if (
                    !timeInput ||
                    !typeInput ||
                    !stockInput ||
                    !quantityInput ||
                    !priceInput ||
                    !totalInput
                ) {
                    return;
                }


                const stock =
                    stockInput
                        .value
                        .trim()
                        .toUpperCase();


                const quantity =
                    Number(
                        quantityInput.value
                    );


                const price =
                    Number(
                        priceInput.value
                    );


                const total =
                    Number(
                        totalInput.value
                    );


                if (!stock) {
                    return;
                }


                if (
                    !Number.isFinite(quantity) ||
                    quantity <= 0
                ) {
                    return;
                }


                if (
                    !Number.isFinite(price) ||
                    price < 0
                ) {
                    return;
                }


                if (
                    !Number.isFinite(total) ||
                    total < 0
                ) {
                    return;
                }


                const timestamp =
                    new Date(
                        timeInput.value
                    ).getTime();


                transactions.push({

                    time:
                        Number.isFinite(timestamp)
                            ? timestamp
                            : Date.now(),

                    type:
                        typeInput.value,

                    stockId:
                        stock,

                    quantity:
                        quantity,

                    price:
                        price,

                    total:
                        total

                });

            }
        );


    return transactions;

}

/* ========================================
   날짜 → datetime-local
======================================== */

function toDateTimeLocal(
    value
) {

    const date =
        new Date(
            Number(value)
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const pad =
        number =>
            String(number)
                .padStart(2, "0");


    return (

        date.getFullYear() +

        "-" +

        pad(
            date.getMonth() + 1
        ) +

        "-" +

        pad(
            date.getDate()
        ) +

        "T" +

        pad(
            date.getHours()
        ) +

        ":" +

        pad(
            date.getMinutes()
        )

    );

}

### 3. `routes/admin.js`

이게 **진짜 중요**해.

기존 `router.patch("/users/:id"...` 부분은 닉네임/현금/플레이어 번호만 처리하고 있었기 때문에, UI에서 보내는 `holdings`, `transactions`도 DB에 저장하도록 수정해야 해. 현재 프론트가 두 값을 보내는 것만으로는 충분하지 않아.

```javascript
// =====================================================
// 플레이어 수정
// =====================================================

router.patch(
    "/users/:id",
    adminAuth,
    async (req, res) => {

        try {

            const id =
                String(req.params.id);


            const {
                nickname,
                cash,
                playerNumber,
                holdings,
                transactions
            } = req.body;


            const fields = [];
            const values = [];

            let index = 1;


            // ========================================
            // 닉네임
            // ========================================

            if (
                nickname !== undefined
            ) {

                const cleanNickname =
                    String(
                        nickname
                    ).trim();


                if (
                    cleanNickname.length < 2
                ) {

                    return res.status(400).json({

                        ok: false,

                        error:
                            "닉네임은 2자 이상이어야 합니다."

                    });

                }


                fields.push(
                    `nickname = $${index++}`
                );

                values.push(
                    cleanNickname
                );

            }


            // ========================================
            // 현금
            // ========================================

            if (
                cash !== undefined
            ) {

                const money =
                    Number(cash);


                if (
                    !Number.isFinite(money) ||
                    money < 0
                ) {

                    return res.status(400).json({

                        ok: false,

                        error:
                            "잘못된 잔액입니다."

                    });

                }


                fields.push(
                    `cash = $${index++}`
                );

                values.push(
                    money
                );

            }


            // ========================================
            // 플레이어 번호
            // ========================================

            if (
                playerNumber !== undefined
            ) {

                const number =
                    Number(
                        playerNumber
                    );


                if (
                    !Number.isInteger(number) ||
                    number <= 0
                ) {

                    return res.status(400).json({

                        ok: false,

                        error:
                            "잘못된 플레이어 번호입니다."

                    });

                }


                fields.push(
                    `player_number = $${index++}`
                );

                values.push(
                    number
                );

            }


            // ========================================
            // 보유 주식
            // ========================================

            if (
                holdings !== undefined
            ) {

                if (
                    !holdings ||
                    typeof holdings !== "object" ||
                    Array.isArray(holdings)
                ) {

                    return res.status(400).json({

                        ok: false,

                        error:
                            "보유 주식 데이터가 올바르지 않습니다."

                    });

                }


                const cleanHoldings = {};


                for (
                    const [
                        stockId,
                        quantity
                    ]
                    of Object.entries(
                        holdings
                    )
                ) {

                    const cleanStockId =
                        String(
                            stockId
                        )
                        .trim()
                        .toUpperCase();


                    const cleanQuantity =
                        Number(
                            quantity
                        );


                    if (
                        !cleanStockId
                    ) {
                        continue;
                    }


                    if (
                        !Number.isFinite(
                            cleanQuantity
                        ) ||
                        cleanQuantity < 0
                    ) {

                        return res.status(400).json({

                            ok: false,

                            error:
                                `보유 수량이 올바르지 않습니다: ${cleanStockId}`

                        });

                    }


                    /*
                     * 0주는 저장하지 않고 제거
                     */

                    if (
                        cleanQuantity > 0
                    ) {

                        cleanHoldings[
                            cleanStockId
                        ] =
                            Math.floor(
                                cleanQuantity
                            );

                    }

                }


                fields.push(
                    `holdings = $${index++}::jsonb`
                );

                values.push(
                    JSON.stringify(
                        cleanHoldings
                    )
                );

            }


            // ========================================
            // 거래 내역
            // ========================================

            if (
                transactions !== undefined
            ) {

                if (
                    !Array.isArray(
                        transactions
                    )
                ) {

                    return res.status(400).json({

                        ok: false,

                        error:
                            "거래 내역 데이터가 올바르지 않습니다."

                    });

                }


                const cleanTransactions =
                    transactions.map(
                        transaction => {

                            const type =
                                transaction.type ||
                                "buy";


                            const stockId =
                                String(
                                    transaction.stockId ||
                                    transaction.stock_id ||
                                    transaction.stock ||
                                    ""
                                )
                                .trim()
                                .toUpperCase();


                            const quantity =
                                Number(
                                    transaction.quantity ||
                                    0
                                );


                            const price =
                                Number(
                                    transaction.price ||
                                    0
                                );


                            const total =
                                Number(
                                    transaction.total ??
                                    quantity * price
                                );


                            const time =
                                Number(
                                    transaction.time ||
                                    Date.now()
                                );


                            if (
                                ![
                                    "buy",
                                    "sell"
                                ].includes(
                                    type
                                )
                            ) {

                                throw new Error(
                                    "거래 구분이 올바르지 않습니다."
                                );

                            }


                            if (
                                !stockId
                            ) {

                                throw new Error(
                                    "거래 종목이 없습니다."
                                );

                            }


                            if (
                                !Number.isFinite(
                                    quantity
                                ) ||
                                quantity <= 0
                            ) {

                                throw new Error(
                                    "거래 수량이 올바르지 않습니다."
                                );

                            }


                            if (
                                !Number.isFinite(
                                    price
                                ) ||
                                price < 0
                            ) {

                                throw new Error(
                                    "거래 가격이 올바르지 않습니다."
                                );

                            }


                            if (
                                !Number.isFinite(
                                    total
                                ) ||
                                total < 0
                            ) {

                                throw new Error(
                                    "거래 총액이 올바르지 않습니다."
                                );

                            }


                            return {

                                time:
                                    Number.isFinite(
                                        time
                                    )
                                        ? time
                                        : Date.now(),

                                type,

                                stockId,

                                quantity:
                                    Math.floor(
                                        quantity
                                    ),

                                price,

                                total

                            };

                        }
                    );


                fields.push(
                    `transactions = $${index++}::jsonb`
                );

                values.push(
                    JSON.stringify(
                        cleanTransactions
                    )
                );

            }


            // ========================================
            // 수정할 내용 없음
            // ========================================

            if (
                fields.length === 0
            ) {

                return res.status(400).json({

                    ok: false,

                    error:
                        "수정할 항목이 없습니다."

                });

            }


            values.push(
                id
            );


            // ========================================
            // DB 수정
            // ========================================

            const result =
                await pool.query(
                    `
                    UPDATE users

                    SET
                        ${fields.join(", ")}

                    WHERE id = $${index}

                    RETURNING
                        id,
                        player_number,
                        username,
                        nickname,
                        cash,
                        holdings,
                        transactions,
                        banned_until,
                        ban_reason,
                        created_at
                    `,
                    values
                );


            if (
                !result.rows.length
            ) {

                return res.status(404).json({

                    ok: false,

                    error:
                        "플레이어를 찾을 수 없습니다."

                });

            }


            res.json({

                ok: true,

                user:
                    result.rows[0]

            });


        } catch (error) {

            console.error(
                "ADMIN USER UPDATE ERROR:",
                error
            );


            if (
                error.code === "23505"
            ) {

                return res.status(409).json({

                    ok: false,

                    error:
                        "이미 사용 중인 닉네임 또는 플레이어 번호입니다."

                });

            }


            if (
                error.message &&
                (
                    error.message.includes(
                        "거래"
                    ) ||
                    error.message.includes(
                        "보유"
                    )
                )
            ) {

                return res.status(400).json({

                    ok: false,

                    error:
                        error.message

                });

            }


            res.status(500).json({

                ok: false,

                error:
                    "플레이어 수정에 실패했습니다."

            });

        }

    }
);
