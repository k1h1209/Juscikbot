
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VSM - 종목 상세</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #202124;
        }

        /* ================================
           상단바
        ================================= */

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            background: rgba(255,255,255,0.94);

            border-bottom:
                1px solid #e5e7eb;

            backdrop-filter: blur(12px);

            z-index: 1000;
        }

        .back-button {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 10px;

            background: transparent;

            font-size: 20px;

            cursor: pointer;
        }

        .back-button:hover {
            background: #eef1f4;
        }

        .logo {
            margin-left: 8px;

            font-size: 20px;
            font-weight: 800;
        }

        .top-spacer {
            flex: 1;
        }

        .money {
            padding: 8px 12px;

            border-radius: 10px;

            background: #f1f3f5;

            font-size: 14px;
            font-weight: 700;
        }

        /* ================================
           메인
        ================================= */

        main {
            padding-top: 58px;
        }

        .content {
            width:
                min(1200px, calc(100% - 32px));

            margin: 0 auto;

            padding:
                35px 0 60px;
        }

        /* ================================
           헤더
        ================================= */

        .stock-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;
        }

        .stock-title {
            font-size: 28px;
            font-weight: 800;
        }

        .stock-id {
            margin-top: 5px;
            color: #8a9098;
            font-size: 13px;
        }

        .price-area {
            text-align: right;
        }

        .price {
            font-size: 32px;
            font-weight: 800;
        }

        .change {
            margin-top: 5px;
            font-size: 14px;
            font-weight: 700;
        }

        .up {
            color: #dc2626;
        }

        .down {
            color: #2563eb;
        }

        .same {
            color: #6b7280;
        }

        /* ================================
           그래프 카드
        ================================= */

        .chart-card {
            padding: 22px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.04);

            margin-bottom: 18px;
        }

        .chart-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .chart-title {
            font-size: 17px;
            font-weight: 800;
        }

        .range-buttons {
            display: flex;
            gap: 6px;
        }

        .range-button {
            padding: 7px 10px;

            border:
                1px solid #e1e4e8;

            border-radius: 8px;

            background: white;

            cursor: pointer;

            font-size: 12px;
        }

        .range-button.active {
            background: #202124;
            color: white;
            border-color: #202124;
        }

        #chart {
            width: 100%;
            height: 360px;
            display: block;
        }

        /* ================================
           정보 카드
        ================================= */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 18px;
        }

        .info-card {
            padding: 18px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;
        }

        .info-label {
            color: #8a9098;

            font-size: 12px;

            margin-bottom: 8px;
        }

        .info-value {
            font-size: 17px;
            font-weight: 800;
        }

        /* ================================
           거래 카드
        ================================= */

        .trade-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 18px;
        }

        .trade-card {
            padding: 22px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.04);
        }

        .trade-title {
            margin-bottom: 6px;

            font-size: 18px;

            font-weight: 800;
        }

        .trade-subtitle {
            margin-bottom: 18px;

            color: #6b7280;

            font-size: 13px;
        }

        .trade-label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            color: #6b7280;

            font-weight: 700;
        }

        .trade-input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #dfe3e8;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .trade-input:focus {
            border-color: #202124;
        }

        .trade-total {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 12px;

            padding: 12px;

            background: #f6f7f8;

            border-radius: 10px;

            font-size: 13px;
        }

        .trade-total strong {
            font-size: 15px;
        }

        .buy-button,
        .sell-button {
            width: 100%;

            margin-top: 12px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;
        }

        .buy-button {
            background: #dc2626;
        }

        .sell-button {
            background: #2563eb;
        }

        .buy-button:hover,
        .sell-button:hover {
            opacity: 0.88;
        }

        .buy-button:disabled,
        .sell-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .holding-box {
            margin-bottom: 18px;

            padding: 15px 18px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .holding-label {
            color: #6b7280;
            font-size: 13px;
        }

        .holding-value {
            font-size: 18px;
            font-weight: 800;
        }

        #tradeMessage {
            display: none;

            margin-bottom: 18px;

            padding: 14px 16px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 700;
        }

        #tradeMessage.success {
            display: block;

            background: #dcfce7;
            color: #166534;
        }

        #tradeMessage.error {
            display: block;

            background: #fee2e2;
            color: #991b1b;
        }

        /* ================================
           로딩
        ================================= */

        .loading {
            padding: 80px 20px;

            text-align: center;

            color: #6b7280;
        }

        .error {
            padding: 60px 20px;

            text-align: center;

            color: #dc2626;
        }

        /* ================================
           모바일
        ================================= */

        @media (max-width: 800px) {

            .content {
                width:
                    calc(100% - 24px);

                padding-top: 25px;
            }

            .stock-header {
                flex-direction: column;
            }

            .price-area {
                text-align: left;
            }

            .info-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .trade-grid {
                grid-template-columns: 1fr;
            }

            #chart {
                height: 280px;
            }

            .money {
                display: none;
            }

            .chart-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .range-buttons {
                width: 100%;
                overflow-x: auto;
            }
        }

    </style>
</head>


<body>


<header class="topbar">

    <button
        class="back-button"
        id="backButton"
    >
        ←
    </button>

    <div class="logo">
        VSM 주식시장
    </div>

    <div class="top-spacer"></div>

    <div class="money">

        💰
        <span id="money">
            10,000
        </span>
        원

    </div>

</header>


<main>

    <div class="content">

        <div
            id="page"
            class="loading"
        >
            📊<br><br>
            종목 정보를 불러오는 중...
        </div>

    </div>

</main>


<script>

/* ========================================
   기본
======================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const stockId =
    params.get("id");

const content =
    document.querySelector(".content");

let currentStock = null;


/* ========================================
   숫자
======================================== */

function money(value) {

    return Number(value || 0)
        .toLocaleString("ko-KR");

}


/* ========================================
   등락 색상
======================================== */

function changeClass(value) {

    if (value > 0) {
        return "up";
    }

    if (value < 0) {
        return "down";
    }

    return "same";

}


/* ========================================
   시간
======================================== */

function formatTime(timestamp) {

    const date =
        new Date(
            Number(timestamp)
        );

    return date.toLocaleTimeString(
        "ko-KR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ========================================
   로그인 토큰
======================================== */

function getToken() {

    return localStorage.getItem(
        "vsm_token"
    );

}


/* ========================================
   뒤로가기
======================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/stocks.html";

        }
    );


/* ========================================
   캔버스 그래프
======================================== */

function drawChart(history) {

    const canvas =
        document.getElementById("chart");

    if (!canvas) {
        return;
    }

    const ctx =
        canvas.getContext("2d");

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.scale(dpr, dpr);

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    if (
        !history ||
        history.length < 2
    ) {

        ctx.fillStyle =
            "#6b7280";

        ctx.font =
            "14px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "그래프 데이터가 부족합니다.",
            width / 2,
            height / 2
        );

        return;

    }

    const prices =
        history.map(
            item => Number(item.p)
        );

    const min =
        Math.min(...prices);

    const max =
        Math.max(...prices);

    const range =
        max - min || 1;

    const padding = 30;

    /* 그리드 */

    ctx.strokeStyle =
        "#eef0f2";

    ctx.lineWidth = 1;

    for (
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            padding +
            (
                height -
                padding * 2
            ) *
            (i / 4);

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }

    /* 그래프 */

    ctx.beginPath();

    history.forEach(
        (item, index) => {

            const x =
                padding +
                (
                    width -
                    padding * 2
                ) *
                (
                    index /
                    (history.length - 1)
                );

            const y =
                height -
                padding -
                (
                    (
                        Number(item.p) -
                        min
                    ) /
                    range
                ) *
                (
                    height -
                    padding * 2
                );

            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );

    ctx.strokeStyle =
        "#202124";

    ctx.lineWidth = 2;

    ctx.stroke();

    /* 마지막 점 */

    const last =
        history[
            history.length - 1
        ];

    const lastX =
        padding +
        (
            width -
            padding * 2
        );

    const lastY =
        height -
        padding -
        (
            (
                Number(last.p) -
                min
            ) /
            range
        ) *
        (
            height -
            padding * 2
        );

    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#202124";

    ctx.fill();

}


/* ========================================
   기간별 차트
======================================== */

async function loadHistory(range) {

    document
        .querySelectorAll(".range-button")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.range === range
                );

            }
        );

    try {

        const response =
            await fetch(
                "/api/stocks/" +
                encodeURIComponent(stockId) +
                "/history?range=" +
                encodeURIComponent(range)
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "그래프를 불러오지 못했습니다."
            );

        }

        drawChart(
            data.history || []
        );

    } catch (error) {

        console.error(
            "HISTORY ERROR:",
            error
        );

    }

}


/* ========================================
   거래 메시지
======================================== */

function showTradeMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "tradeMessage"
        );

    if (!box) {
        return;
    }

    box.className =
        type;

    box.textContent =
        message;

    box.style.display =
        "block";

}


/* ========================================
   예상 거래금액
======================================== */

function updateTradeTotal(
    inputId,
    totalId
) {

    const input =
        document.getElementById(
            inputId
        );

    const totalElement =
        document.getElementById(
            totalId
        );

    if (
        !input ||
        !totalElement ||
        !currentStock
    ) {
        return;
    }

    const quantity =
        Math.max(
            0,
            Number(input.value || 0)
        );

    const total =
        Number(currentStock.price) *
        quantity;

    totalElement.textContent =
        money(total) + "원";

}


/* ========================================
   보유주식 불러오기
======================================== */

async function loadPortfolio() {

    const token =
        getToken();

    if (!token) {

        document
            .getElementById(
                "holdingQuantity"
            )
            .textContent =
                "로그인 필요";

        return;

    }

    try {

        const response =
            await fetch(
                "/api/stocks/portfolio/me",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "보유주식을 불러오지 못했습니다."
            );

        }

        const holding =
            (data.holdings || [])
                .find(
                    item =>
                        item.id === stockId
                );

        document
            .getElementById(
                "holdingQuantity"
            )
            .textContent =
                holding
                    ? money(holding.quantity) + "주"
                    : "0주";

    } catch (error) {

        console.error(
            "PORTFOLIO ERROR:",
            error
        );

    }

}


/* ========================================
   사용자 정보
======================================== */

async function loadUser() {

    const token =
        getToken();

    if (!token) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/auth/me",
                {
                    headers: {
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (
            data.ok &&
            data.user
        ) {

            document
                .getElementById(
                    "money"
                )
                .textContent =
                    money(
                        data.user.cash
                    );

        }

    } catch (error) {

        console.error(
            "USER ERROR:",
            error
        );

    }

}


/* ========================================
   거래 실행
======================================== */

async function trade(
    type,
    quantity
) {

    const token =
        getToken();

    if (!token) {

        showTradeMessage(
            "로그인이 필요합니다.",
            "error"
        );

        return;

    }

    if (!currentStock) {

        showTradeMessage(
            "종목 정보를 불러오는 중입니다.",
            "error"
        );

        return;

    }

    const qty =
        Number(quantity);

    if (
        !Number.isInteger(qty) ||
        qty <= 0
    ) {

        showTradeMessage(
            "수량은 1주 이상의 정수로 입력하세요.",
            "error"
        );

        return;

    }

    const button =
        document.getElementById(
            type === "buy"
                ? "buyButton"
                : "sellButton"
        );

    if (button) {
        button.disabled = true;
    }

    showTradeMessage(
        type === "buy"
            ? "매수 처리 중..."
            : "매도 처리 중...",
        "success"
    );

    try {

        const response =
            await fetch(
                type === "buy"
                    ? "/api/stocks/buy"
                    : "/api/stocks/sell",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify({
                            stockId,
                            quantity: qty
                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "거래에 실패했습니다."
            );

        }

        showTradeMessage(
            data.message ||
            "거래가 완료되었습니다.",
            "success"
        );

        document
            .getElementById(
                type === "buy"
                    ? "buyQuantity"
                    : "sellQuantity"
            )
            .value = "";

        updateTradeTotal(
            type === "buy"
                ? "buyQuantity"
                : "sellQuantity",
            type === "buy"
                ? "buyTotal"
                : "sellTotal"
        );

        await loadUser();

        await loadPortfolio();

        await loadStock();

    } catch (error) {

        console.error(
            "TRADE ERROR:",
            error
        );

        showTradeMessage(
            "❌ " + error.message,
            "error"
        );

    } finally {

        if (button) {
            button.disabled = false;
        }

    }

}


/* ========================================
   거래 UI 이벤트
======================================== */

function setupTradeEvents() {

    const buyInput =
        document.getElementById(
            "buyQuantity"
        );

    const sellInput =
        document.getElementById(
            "sellQuantity"
        );

    if (buyInput) {

        buyInput.addEventListener(
            "input",
            () => {

                updateTradeTotal(
                    "buyQuantity",
                    "buyTotal"
                );

            }
        );

    }

    if (sellInput) {

        sellInput.addEventListener(
            "input",
            () => {

                updateTradeTotal(
                    "sellQuantity",
                    "sellTotal"
                );

            }
        );

    }

    document
        .getElementById(
            "buyButton"
        )
        .addEventListener(
            "click",
            () => {

                trade(
                    "buy",
                    buyInput.value
                );

            }
        );

    document
        .getElementById(
            "sellButton"
        )
        .addEventListener(
            "click",
            () => {

                trade(
                    "sell",
                    sellInput.value
                );

            }
        );

}


/* ========================================
   주식 상세정보
======================================== */

async function loadStock() {

    if (!stockId) {

        content.innerHTML = `
            <div class="error">
                잘못된 종목 주소입니다.
            </div>
        `;

        return;

    }

    try {

        const response =
            await fetch(
                "/api/stocks/" +
                encodeURIComponent(stockId)
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "종목 정보를 불러오지 못했습니다."
            );

        }

        const stock =
            data.stock;

        currentStock =
            stock;

        /* 상세 API의 previous를 이용해 등락 계산 */

        const price =
            Number(stock.price);

        const previous =
            Number(stock.previous);

        const change =
            price - previous;

        const changeRate =
            previous === 0
                ? 0
                : (
                    change /
                    previous
                ) * 100;

        const sign =
            change > 0
                ? "+"
                : "";

        const cls =
            changeClass(change);

        content.innerHTML = `

            <section class="stock-header">

                <div>

                    <div class="stock-title">
                        ${stock.name}
                    </div>

                    <div class="stock-id">
                        ${stock.id}
                    </div>

                </div>


                <div class="price-area">

                    <div class="price">
                        ${money(stock.price)}원
                    </div>

                    <div
                        class="change ${cls}"
                    >
                        ${sign}${money(change)}원
                        (${sign}${changeRate.toFixed(2)}%)
                    </div>

                </div>

            </section>


            <section class="chart-card">

                <div class="chart-header">

                    <div class="chart-title">
                        📈 주가 차트
                    </div>


                    <div class="range-buttons">

                        <button
                            class="range-button active"
                            data-range="1d"
                        >
                            1일
                        </button>

                        <button
                            class="range-button"
                            data-range="1w"
                        >
                            1주
                        </button>

                        <button
                            class="range-button"
                            data-range="1m"
                        >
                            1개월
                        </button>

                        <button
                            class="range-button"
                            data-range="3m"
                        >
                            3개월
                        </button>

                        <button
                            class="range-button"
                            data-range="all"
                        >
                            전체
                        </button>

                    </div>

                </div>


                <canvas id="chart"></canvas>

            </section>


            <section class="info-grid">

                <div class="info-card">

                    <div class="info-label">
                        시가
                    </div>

                    <div class="info-value">
                        ${money(stock.open)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        최고가
                    </div>

                    <div class="info-value">
                        ${money(stock.high)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        최저가
                    </div>

                    <div class="info-value">
                        ${money(stock.low)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        거래량
                    </div>

                    <div class="info-value">
                        ${money(stock.volume)}
                    </div>

                </div>

            </section>


            <div
                id="tradeMessage"
            ></div>


            <section class="holding-box">

                <div class="holding-label">
                    현재 보유 수량
                </div>

                <div
                    class="holding-value"
                    id="holdingQuantity"
                >
                    확인 중...
                </div>

            </section>


            <section class="trade-grid">


                <!-- 매수 -->

                <div class="trade-card">

                    <div class="trade-title">
                        🔴 주식 매수
                    </div>

                    <div class="trade-subtitle">
                        현재가 기준으로 주식을 구매합니다.
                    </div>


                    <label
                        class="trade-label"
                        for="buyQuantity"
                    >
                        매수 수량
                    </label>


                    <input
                        id="buyQuantity"
                        class="trade-input"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="매수할 주식 수"
                    >


                    <div class="trade-total">

                        <span>
                            예상 금액
                        </span>

                        <strong id="buyTotal">
                            0원
                        </strong>

                    </div>


                    <button
                        id="buyButton"
                        class="buy-button"
                    >
                        매수하기
                    </button>

                </div>


                <!-- 매도 -->

                <div class="trade-card">

                    <div class="trade-title">
                        🔵 주식 매도
                    </div>

                    <div class="trade-subtitle">
                        보유한 주식을 현재가로 판매합니다.
                    </div>


                    <label
                        class="trade-label"
                        for="sellQuantity"
                    >
                        매도 수량
                    </label>


                    <input
                        id="sellQuantity"
                        class="trade-input"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="매도할 주식 수"
                    >


                    <div class="trade-total">

                        <span>
                            예상 금액
                        </span>

                        <strong id="sellTotal">
                            0원
                        </strong>

                    </div>


                    <button
                        id="sellButton"
                        class="sell-button"
                    >
                        매도하기
                    </button>

                </div>

            </section>

        `;


        document
            .querySelectorAll(
                ".range-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            loadHistory(
                                button.dataset.range
                            );

                        }
                    );

                }
            );


        setupTradeEvents();

        await loadHistory("1d");

        await loadPortfolio();

    } catch (error) {

        console.error(
            "STOCK ERROR:",
            error
        );

        content.innerHTML = `

            <div class="error">

                ❌
                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* ========================================
   시작
======================================== */

loadStock();

loadUser();

</script>

</body>
</html>
