
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VSM - 종목 상세</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #202124;
        }

        /* ================================
           상단바
        ================================= */

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            background: rgba(255,255,255,0.94);

            border-bottom:
                1px solid #e5e7eb;

            backdrop-filter: blur(12px);

            z-index: 1000;
        }

        .back-button {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 10px;

            background: transparent;

            font-size: 20px;

            cursor: pointer;
        }

        .back-button:hover {
            background: #eef1f4;
        }

        .logo {
            margin-left: 8px;

            font-size: 20px;
            font-weight: 800;
        }

        .top-spacer {
            flex: 1;
        }

        .money {
            padding: 8px 12px;

            border-radius: 10px;

            background: #f1f3f5;

            font-size: 14px;
            font-weight: 700;
        }

        /* ================================
           메인
        ================================= */

        main {
            padding-top: 58px;
        }

        .content {
            width:
                min(1200px, calc(100% - 32px));

            margin: 0 auto;

            padding:
                35px 0 60px;
        }

        /* ================================
           헤더
        ================================= */

        .stock-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;
        }

        .stock-title {

            font-size: 28px;

            font-weight: 800;
        }

        .stock-id {

            margin-top: 5px;

            color: #8a9098;

            font-size: 13px;
        }

        .price-area {
            text-align: right;
        }

        .price {

            font-size: 32px;

            font-weight: 800;
        }

        .change {

            margin-top: 5px;

            font-size: 14px;

            font-weight: 700;
        }

        .up {
            color: #dc2626;
        }

        .down {
            color: #2563eb;
        }

        .same {
            color: #6b7280;
        }

        /* ================================
           그래프 카드
        ================================= */

        .chart-card {

            padding: 22px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.04);

            margin-bottom: 18px;
        }

        .chart-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .chart-title {

            font-size: 17px;

            font-weight: 800;
        }

        .range-buttons {

            display: flex;

            gap: 6px;
        }

        .range-button {

            padding: 7px 10px;

            border: 1px solid #e1e4e8;

            border-radius: 8px;

            background: white;

            cursor: pointer;

            font-size: 12px;
        }

        .range-button.active {

            background: #202124;

            color: white;

            border-color: #202124;
        }

        #chart {

            width: 100%;

            height: 360px;

            display: block;
        }

        /* ================================
           정보 카드
        ================================= */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 18px;
        }

        .info-card {

            padding: 18px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;
        }

        .info-label {

            color: #8a9098;

            font-size: 12px;

            margin-bottom: 8px;
        }

        .info-value {

            font-size: 17px;

            font-weight: 800;
        }

        /* ================================
           로딩
        ================================= */

        .loading {

            padding: 80px 20px;

            text-align: center;

            color: #6b7280;
        }

        .error {

            padding: 60px 20px;

            text-align: center;

            color: #dc2626;
        }

        /* ================================
           모바일
        ================================= */

        @media (max-width: 800px) {

            .content {
                width:
                    calc(100% - 24px);

                padding-top: 25px;
            }

            .stock-header {

                flex-direction: column;
            }

            .price-area {

                text-align: left;
            }

            .info-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            #chart {
                height: 280px;
            }

            .money {
                display: none;
            }

        }

    </style>
</head>


<body>


<header class="topbar">

    <button
        class="back-button"
        id="backButton"
    >
        ←
    </button>

    <div class="logo">
        VSM 주식시장
    </div>

    <div class="top-spacer"></div>

    <div class="money">

        💰
        <span id="money">
            10,000
        </span>
        원

    </div>

</header>


<main>

    <div class="content">

        <div
            id="page"
            class="loading"
        >
            📊<br><br>
            종목 정보를 불러오는 중...
        </div>

    </div>

</main>


<script>

/* ========================================
   기본
======================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const stockId =
    params.get("id");


const content =
    document.querySelector(
        ".content"
    );


/* ========================================
   숫자
======================================== */

function money(value) {

    return Number(value || 0)
        .toLocaleString("ko-KR");

}


/* ========================================
   등락 색상
======================================== */

function changeClass(value) {

    if (value > 0) {
        return "up";
    }

    if (value < 0) {
        return "down";
    }

    return "same";

}


/* ========================================
   시간
======================================== */

function formatTime(timestamp) {

    const date =
        new Date(
            Number(timestamp)
        );

    return date.toLocaleTimeString(
        "ko-KR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ========================================
   뒤로가기
======================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "/stocks.html";

        }
    );


/* ========================================
   캔버스 그래프
======================================== */

function drawChart(history) {

    const canvas =
        document.getElementById(
            "chart"
        );

    if (!canvas) {
        return;
    }

    const ctx =
        canvas.getContext("2d");


    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    ctx.scale(dpr, dpr);


    const width =
        rect.width;

    const height =
        rect.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        !history ||
        history.length < 2
    ) {

        ctx.fillStyle =
            "#6b7280";

        ctx.font =
            "14px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "그래프 데이터가 부족합니다.",
            width / 2,
            height / 2
        );

        return;

    }


    const prices =
        history.map(
            item => Number(item.p)
        );


    const min =
        Math.min(...prices);

    const max =
        Math.max(...prices);


    const range =
        max - min || 1;


    const padding = 30;


    /* ================================
       그리드
    ================================= */

    ctx.strokeStyle =
        "#eef0f2";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            padding +
            (
                height -
                padding * 2
            ) *
            (i / 4);


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /* ================================
       그래프
    ================================= */

    ctx.beginPath();


    history.forEach(
        (item, index) => {

            const x =
                padding +
                (
                    width -
                    padding * 2
                ) *
                (
                    index /
                    (history.length - 1)
                );


            const y =
                height -
                padding -
                (
                    (
                        Number(item.p) -
                        min
                    ) /
                    range
                ) *
                (
                    height -
                    padding * 2
                );


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#202124";

    ctx.lineWidth = 2;

    ctx.stroke();


    /* ================================
       마지막 점
    ================================= */

    const last =
        history[
            history.length - 1
        ];


    const lastX =
        padding +
        (
            width -
            padding * 2
        );


    const lastY =
        height -
        padding -
        (
            (
                Number(last.p) -
                min
            ) /
            range
        ) *
        (
            height -
            padding * 2
        );


    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#202124";

    ctx.fill();

}


/* ========================================
   기간 버튼
======================================== */

async function loadHistory(range) {

    document
        .querySelectorAll(
            ".range-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.range === range
                );

            }
        );


    try {

        const response =
            await fetch(
                "/api/stocks/" +
                encodeURIComponent(stockId) +
                "/history?range=" +
                encodeURIComponent(range)
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "그래프를 불러오지 못했습니다."
            );

        }


        drawChart(
            data.history || []
        );


    } catch (error) {

        console.error(
            "HISTORY ERROR:",
            error
        );

    }

}


/* ========================================
   주식 상세정보
======================================== */

async function loadStock() {

    if (!stockId) {

        content.innerHTML = `
            <div class="error">
                잘못된 종목 주소입니다.
            </div>
        `;

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stocks/" +
                encodeURIComponent(stockId)
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "종목 정보를 불러오지 못했습니다."
            );

        }


        const stock =
            data.stock;


        const change =
            Number(
                stock.change || 0
            );


        const changeRate =
            Number(
                stock.changeRate || 0
            );


        const sign =
            change > 0
                ? "+"
                : "";


        const cls =
            changeClass(change);


        content.innerHTML = `

            <section class="stock-header">

                <div>

                    <div class="stock-title">
                        ${stock.name}
                    </div>

                    <div class="stock-id">
                        ${stock.id}
                    </div>

                </div>


                <div class="price-area">

                    <div class="price">
                        ${money(stock.price)}원
                    </div>

                    <div
                        class="change ${cls}"
                    >
                        ${sign}${money(change)}원
                        (${sign}${changeRate.toFixed(2)}%)
                    </div>

                </div>

            </section>


            <section class="chart-card">

                <div class="chart-header">

                    <div class="chart-title">
                        📈 주가 차트
                    </div>


                    <div class="range-buttons">

                        <button
                            class="range-button active"
                            data-range="1d"
                        >
                            1일
                        </button>

                        <button
                            class="range-button"
                            data-range="1w"
                        >
                            1주
                        </button>

                        <button
                            class="range-button"
                            data-range="1m"
                        >
                            1개월
                        </button>

                        <button
                            class="range-button"
                            data-range="3m"
                        >
                            3개월
                        </button>

                        <button
                            class="range-button"
                            data-range="all"
                        >
                            전체
                        </button>

                    </div>

                </div>


                <canvas id="chart"></canvas>

            </section>


            <section class="info-grid">

                <div class="info-card">

                    <div class="info-label">
                        시가
                    </div>

                    <div class="info-value">
                        ${money(stock.open)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        최고가
                    </div>

                    <div class="info-value">
                        ${money(stock.high)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        최저가
                    </div>

                    <div class="info-value">
                        ${money(stock.low)}원
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        거래량
                    </div>

                    <div class="info-value">
                        ${money(stock.volume)}
                    </div>

                </div>

            </section>

        `;


        document
            .querySelectorAll(
                ".range-button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            loadHistory(
                                button.dataset.range
                            );

                        }
                    );

                }
            );


        await loadHistory("1d");


    } catch (error) {

        console.error(
            "STOCK ERROR:",
            error
        );


        content.innerHTML = `

            <div class="error">

                ❌
                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* ========================================
   로그인 사용자 현금
======================================== */

async function loadUser() {

    const token =
        localStorage.getItem(
            "vsm_token"
        );


    if (!token) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/auth/me",
                {
                    headers: {
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        if (
            data.ok &&
            data.user
        ) {

            document
                .getElementById(
                    "money"
                )
                .textContent =
                    money(
                        data.user.cash
                    );

        }

    } catch (error) {

        console.error(
            "USER ERROR:",
            error
        );

    }

}


/* ========================================
   시작
======================================== */

loadStock();

loadUser();

</script>

</body>
</html>
