```html
<script>
document.addEventListener("DOMContentLoaded", () => {

    // =====================================================
    // 요소
    // =====================================================

    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");

    const themeButton = document.getElementById("themeButton");
    const stocksMenuButton = document.getElementById("stocksMenuButton");
    const bankMenuButton = document.getElementById("bankMenuButton");

    const profileButton = document.getElementById("profileButton");
    const notificationButton =
        document.getElementById("notificationButton");

    const authOverlay = document.getElementById("authOverlay");
    const profileOverlay = document.getElementById("profileOverlay");

    const authTitle = document.getElementById("authTitle");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const authMessage = document.getElementById("authMessage");

    const moneyElement = document.getElementById("money");
    const assetMoneyElement =
        document.getElementById("assetMoney");


    // =====================================================
    // 안전 확인
    // =====================================================

    console.log("VSM UI JavaScript 시작");

    if (!menuButton) {
        console.error("menuButton을 찾을 수 없습니다.");
    }

    if (!profileButton) {
        console.error("profileButton을 찾을 수 없습니다.");
    }


    // =====================================================
    // 메뉴
    // =====================================================

    if (menuButton && menuPanel) {

        menuButton.addEventListener("click", (event) => {

            event.stopPropagation();

            menuPanel.classList.toggle("open");

        });

    }


    // =====================================================
    // 메뉴 외부 클릭
    // =====================================================

    document.addEventListener("click", (event) => {

        if (!menuPanel || !menuButton) {
            return;
        }

        if (
            !menuPanel.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {

            menuPanel.classList.remove("open");

        }

    });


    // =====================================================
    // 다크모드
    // =====================================================

    if (themeButton) {

        themeButton.addEventListener("click", () => {

            document.body.classList.toggle("dark");

            const isDark =
                document.body.classList.contains("dark");

            localStorage.setItem(
                "vsm-theme",
                isDark ? "dark" : "light"
            );

            themeButton.innerHTML =
                isDark
                    ? "☀️ <span>화이트모드</span>"
                    : "🌙 <span>다크모드</span>";

        });

    }


    const savedTheme =
        localStorage.getItem("vsm-theme");

    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        if (themeButton) {

            themeButton.innerHTML =
                "☀️ <span>화이트모드</span>";

        }

    }


    // =====================================================
    // 주식
    // =====================================================

    if (stocksMenuButton) {

        stocksMenuButton.addEventListener("click", () => {

            window.location.href = "/stocks.html";

        });

    }


    // =====================================================
    // 안드로메다뱅크
    // =====================================================

    if (bankMenuButton) {

        bankMenuButton.addEventListener("click", () => {

            window.location.href = "/bank.html";

        });

    }


    // =====================================================
    // 알림
    // =====================================================

    if (notificationButton) {

        notificationButton.addEventListener("click", () => {

            alert("현재 새로운 알림이 없습니다.");

        });

    }


    // =====================================================
    // 로그인 / 회원가입
    // =====================================================

    function showLoginForm() {

        if (!authOverlay) {
            return;
        }

        if (authTitle) {
            authTitle.textContent = "로그인";
        }

        if (loginForm) {
            loginForm.style.display = "block";
        }

        if (registerForm) {
            registerForm.style.display = "none";
        }

        if (authMessage) {
            authMessage.textContent = "";
        }

        authOverlay.style.display = "flex";

    }


    function showRegisterForm() {

        if (!authOverlay) {
            return;
        }

        if (authTitle) {
            authTitle.textContent = "회원가입";
        }

        if (loginForm) {
            loginForm.style.display = "none";
        }

        if (registerForm) {
            registerForm.style.display = "block";
        }

        if (authMessage) {
            authMessage.textContent = "";
        }

        authOverlay.style.display = "flex";

    }


    // =====================================================
    // 인증창 버튼
    // =====================================================

    const showRegister =
        document.getElementById("showRegister");

    const showLogin =
        document.getElementById("showLogin");

    const closeAuth =
        document.getElementById("closeAuth");


    if (showRegister) {

        showRegister.addEventListener(
            "click",
            showRegisterForm
        );

    }


    if (showLogin) {

        showLogin.addEventListener(
            "click",
            showLoginForm
        );

    }


    if (closeAuth) {

        closeAuth.addEventListener("click", () => {

            authOverlay.style.display = "none";

        });

    }


    // =====================================================
    // 사용자 UI
    // =====================================================

    function updateUserUI(user) {

        if (!user) {
            return;
        }

        const cash =
            Number(user.cash || 0);

        const formattedCash =
            cash.toLocaleString("ko-KR");

        if (moneyElement) {

            moneyElement.textContent =
                formattedCash;

        }

        if (assetMoneyElement) {

            assetMoneyElement.textContent =
                formattedCash + "원";

        }

    }


    // =====================================================
    // 프로필
    // =====================================================

    function formatPlayerNumber(number) {

        if (
            number === null ||
            number === undefined ||
            number === ""
        ) {

            return "-----";

        }

        const n =
            Number(number);

        if (!Number.isFinite(n)) {

            return "-----";

        }

        return String(
            Math.trunc(n)
        ).padStart(5, "0");

    }


    function showProfile(user) {

        if (!user) {

            showLoginForm();

            return;

        }

        const nickname =
            document.getElementById(
                "profileNickname"
            );

        const username =
            document.getElementById(
                "profileUsername"
            );

        const playerId =
            document.getElementById(
                "profileId"
            );

        const profileCash =
            document.getElementById(
                "profileCash"
            );


        if (nickname) {

            nickname.textContent =
                user.nickname || "사용자";

        }


        if (username) {

            username.textContent =
                "@" +
                (user.username || "unknown");

        }


        // =================================================
        // 중요
        // UUID가 아니라 playerNumber 표시
        // 5 → 00005
        // 23 → 00023
        // =================================================

        if (playerId) {

            playerId.textContent =
                formatPlayerNumber(
                    user.playerNumber
                );

        }


        if (profileCash) {

            profileCash.textContent =
                Number(
                    user.cash || 0
                ).toLocaleString("ko-KR") +
                "원";

        }


        if (profileOverlay) {

            profileOverlay.style.display =
                "flex";

        }

    }


    // =====================================================
    // 프로필 버튼
    // =====================================================

    if (profileButton) {

        profileButton.addEventListener(
            "click",
            async (event) => {

                event.stopPropagation();

                const token =
                    localStorage.getItem(
                        "vsm_token"
                    );


                if (!token) {

                    showLoginForm();

                    return;

                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/me",
                            {
                                method: "GET",

                                headers: {
                                    "Authorization":
                                        "Bearer " +
                                        token
                                }
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.ok ||
                        !data.user
                    ) {

                        localStorage.removeItem(
                            "vsm_token"
                        );

                        showLoginForm();

                        return;

                    }


                    showProfile(
                        data.user
                    );


                } catch (error) {

                    console.error(
                        "PROFILE ERROR:",
                        error
                    );

                    alert(
                        "프로필 정보를 불러오지 못했습니다."
                    );

                }

            }
        );

    }


    // =====================================================
    // 프로필 닫기
    // =====================================================

    const closeProfile =
        document.getElementById(
            "closeProfile"
        );


    if (closeProfile) {

        closeProfile.addEventListener(
            "click",
            () => {

                profileOverlay.style.display =
                    "none";

            }
        );

    }


    // =====================================================
    // 회원가입
    // =====================================================

    const registerSubmit =
        document.getElementById(
            "registerSubmit"
        );


    if (registerSubmit) {

        registerSubmit.addEventListener(
            "click",
            async () => {

                const username =
                    document
                        .getElementById(
                            "registerUsername"
                        )
                        .value
                        .trim();


                const nickname =
                    document
                        .getElementById(
                            "registerNickname"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "registerPassword"
                        )
                        .value;


                if (authMessage) {

                    authMessage.textContent =
                        "회원가입 중...";

                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username,
                                        nickname,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "회원가입에 실패했습니다."
                        );

                    }


                    localStorage.setItem(
                        "vsm_token",
                        data.token
                    );


                    updateUserUI(
                        data.user
                    );


                    if (authMessage) {

                        authMessage.textContent =
                            "회원가입 성공! 🎉";

                    }


                    setTimeout(() => {

                        authOverlay.style.display =
                            "none";

                    }, 700);


                } catch (error) {

                    console.error(
                        "REGISTER ERROR:",
                        error
                    );

                    if (authMessage) {

                        authMessage.textContent =
                            "❌ " +
                            error.message;

                    }

                }

            }
        );

    }


    // =====================================================
    // 로그인
    // =====================================================

    const loginSubmit =
        document.getElementById(
            "loginSubmit"
        );


    if (loginSubmit) {

        loginSubmit.addEventListener(
            "click",
            async () => {

                const username =
                    document
                        .getElementById(
                            "loginUsername"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "loginPassword"
                        )
                        .value;


                if (authMessage) {

                    authMessage.textContent =
                        "로그인 중...";

                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "로그인에 실패했습니다."
                        );

                    }


                    localStorage.setItem(
                        "vsm_token",
                        data.token
                    );


                    updateUserUI(
                        data.user
                    );


                    if (authMessage) {

                        authMessage.textContent =
                            "로그인 성공! 🎉";

                    }


                    setTimeout(() => {

                        authOverlay.style.display =
                            "none";

                    }, 700);


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    if (authMessage) {

                        authMessage.textContent =
                            "❌ " +
                            error.message;

                    }

                }

            }
        );

    }


    // =====================================================
    // 로그아웃
    // =====================================================

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    if (logoutButton) {

        logoutButton.addEventListener(
            "click",
            async () => {

                const token =
                    localStorage.getItem(
                        "vsm_token"
                    );


                try {

                    if (token) {

                        await fetch(
                            "/api/auth/logout",
                            {
                                method: "POST",

                                headers: {
                                    "Authorization":
                                        "Bearer " +
                                        token
                                }
                            }
                        );

                    }

                } catch (error) {

                    console.error(
                        "LOGOUT ERROR:",
                        error
                    );

                }


                localStorage.removeItem(
                    "vsm_token"
                );


                if (profileOverlay) {

                    profileOverlay.style.display =
                        "none";

                }


                if (moneyElement) {

                    moneyElement.textContent =
                        "10,000";

                }


                if (assetMoneyElement) {

                    assetMoneyElement.textContent =
                        "10,000원";

                }


                alert(
                    "로그아웃되었습니다."
                );

            }
        );

    }


    // =====================================================
    // 기존 로그인 상태 확인
    // =====================================================

    async function checkLogin() {

        const token =
            localStorage.getItem(
                "vsm_token"
            );


        if (!token) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/auth/me",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " +
                                token
                        }
                    }
                );


            if (!response.ok) {

                localStorage.removeItem(
                    "vsm_token"
                );

                return;

            }


            const data =
                await response.json();


            if (
                data.ok &&
                data.user
            ) {

                updateUserUI(
                    data.user
                );

            }

        } catch (error) {

            console.error(
                "LOGIN CHECK ERROR:",
                error
            );

        }

    }


    // =====================================================
    // 시작
    // =====================================================

    checkLogin();

});
</script>
```
